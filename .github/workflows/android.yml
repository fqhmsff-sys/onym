name: Bangun APK Android

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Alamat server HTTPS (opsional; kosongkan untuk mode lokal)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "web/**"
      - "mobile/**"
      - ".github/workflows/android.yml"
      - "BUILD_ANDROID"

permissions:
  contents: read

concurrency:
  group: onym-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi mobile
        working-directory: mobile
        run: npm install

      - name: Salin web
        working-directory: mobile
        env:
          ONYM_API_URL: ${{ inputs.api_url || '' }}
        run: node scripts/sync-web.mjs

      - name: Buat proyek Android
        working-directory: mobile
        run: npm run add:android

      - name: Sinkronkan dan bangun APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Siapkan APK Onym
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Onym.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Onym-APK
          path: Onym.apk
          if-no-files-found: error
          retention-days: 30
